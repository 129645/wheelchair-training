<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電動輪椅操作練習</title>
<style>
  :root{
    --ink:#1f2a2e; --ink-soft:#4a5a60; --paper:#fbfaf6; --line:#d9ddd6;
    --go:#2e8b57; --go-deep:#1f6b42; --warn:#d9822b; --sky:#2b6f8f;
    --font: "Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#12181a;color:var(--ink);font-family:var(--font);overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));background:#000;
    user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
  #cv{width:100%;height:100%;display:block}
  #vid{position:absolute;left:0;top:0;width:4px;height:4px;opacity:0;pointer-events:none}

  /* ---- HUD ---- */
  #hud{position:absolute;inset:0;pointer-events:none;font-size:clamp(12px,1.55vw,20px)}
  #hud.hidden{display:none}
  .chip{position:absolute;background:rgba(251,250,246,.92);border-radius:.7em;padding:.45em .8em;
    box-shadow:0 2px 10px rgba(0,0,0,.18);font-weight:600}
  #lvName{left:1.2%;top:2%}
  #btns{right:1.2%;top:2%;display:flex;gap:.5em;pointer-events:auto;background:none;box-shadow:none;padding:0}
  #btns button{font:inherit;font-weight:600;border:0;border-radius:.7em;padding:.45em .8em;cursor:pointer;
    background:rgba(251,250,246,.92);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18)}
  #btns button:hover{background:#fff}
  #btns button:focus-visible,.panel button:focus-visible,.seg label:focus-within{outline:3px solid var(--sky);outline-offset:2px}
  #prog{left:1.2%;top:9.5%;width:22%;padding:.45em .8em;display:flex;align-items:center;gap:.6em}
  #progBar{flex:1;height:.7em;border-radius:.35em;background:#e4e7e0;overflow:hidden}
  #progFill{height:100%;width:0;background:var(--go);border-radius:.35em}
  #progTxt{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
  #hint{left:50%;bottom:13.5%;transform:translateX(-50%);font-size:1.15em;text-align:center;max-width:80%;white-space:nowrap;
    transition:opacity .25s;opacity:0}
  #hint.show{opacity:1}
  #hint.warn{background:rgba(255,241,222,.96);color:#7a4310}
  #status{left:1.2%;bottom:3%;display:flex;align-items:center;gap:.5em}
  #statusDot{width:.9em;height:.9em;border-radius:50%;background:var(--go)}
  #status.off #statusDot{background:var(--warn);border-radius:.15em}

  /* ---- panels ---- */
  .panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(18,24,26,.55);backdrop-filter:blur(3px);font-size:clamp(12px,1.5vw,19px)}
  .panel.hidden{display:none}
  .card{background:var(--paper);border-radius:1.1em;padding:1.5em 1.8em;width:min(92%,46em);max-height:94%;overflow:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .card h1{margin:0 0 .15em;font-size:1.75em;letter-spacing:.04em}
  .card h2{margin:0 0 .5em;font-size:1.45em}
  .card p{margin:.3em 0;color:var(--ink-soft);line-height:1.55}
  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em;margin:.9em 0 1em}
  .how div{background:#fff;border:1px solid var(--line);border-radius:.8em;padding:.7em .6em;text-align:center}
  .how svg{width:3.2em;height:3.2em;display:block;margin:0 auto .3em}
  .how b{display:block;color:var(--ink)}
  .how span{font-size:.88em;color:var(--ink-soft)}
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em;margin:.4em 0 1em}
  .levels button{font:inherit;text-align:left;border:2px solid var(--go);background:#fff;border-radius:.9em;
    padding:.75em .8em;cursor:pointer;color:var(--ink)}
  .levels button:hover{background:#eef7f0}
  .levels button b{display:block;font-size:1.12em;color:var(--go-deep)}
  .levels button span{font-size:.88em;color:var(--ink-soft)}
  .opts{display:flex;flex-wrap:wrap;gap:.6em 1.6em;align-items:center;border-top:1px solid var(--line);padding-top:.8em}
  .opt{display:flex;align-items:center;gap:.6em}
  .opt>span{font-weight:600}
  .seg{display:inline-flex;border:1px solid #b9c0b6;border-radius:.6em;overflow:hidden;background:#fff}
  .seg label{padding:.3em .75em;cursor:pointer;border-left:1px solid #b9c0b6}
  .seg label:first-child{border-left:0}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label:has(input:checked){background:var(--go);color:#fff}
  .note{font-size:.82em;color:#6b777b;margin-top:.8em}
  #loadMsg{font-weight:600;color:var(--sky)}
  #loadMsg.err{color:#a23b2a}
  table.res{width:100%;border-collapse:collapse;margin:.6em 0 1em}
  table.res td{padding:.5em .3em;border-bottom:1px solid var(--line)}
  table.res td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.1em}
  table.res small{color:#6b777b;font-weight:400}
  .row{display:flex;gap:.6em;flex-wrap:wrap}
  .row button{font:inherit;font-weight:600;border-radius:.8em;padding:.6em 1.1em;cursor:pointer;border:2px solid var(--go);background:#fff;color:var(--go-deep)}
  .row button.main{background:var(--go);color:#fff}
  .row button:hover{filter:brightness(.96)}
  @media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720" aria-label="電動輪椅操作練習畫面"></canvas>
  <video id="vid" muted playsinline preload="auto" loop></video>

  <div id="hud" class="hidden">
    <div id="lvName" class="chip"></div>
    <div id="prog" class="chip"><div id="progBar"><div id="progFill"></div></div><div id="progTxt">0%</div></div>
    <div id="btns" class="chip">
      <button id="btnSound" type="button" aria-pressed="true">聲音:開</button>
      <button id="btnMenu" type="button">回選單</button>
    </div>
    <div id="hint" class="chip" role="status" aria-live="polite"></div>
    <div id="status" class="chip"><span id="statusDot"></span><span id="statusTxt">在路徑上</span></div>
  </div>

  <div id="menu" class="panel">
    <div class="card">
      <h1>電動輪椅操作練習</h1>
      <p>用滑鼠操作影片裡的電動輪椅,沿著地上的綠色路徑前進。</p>
      <div class="how">
        <div><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="6" width="20" height="36" rx="10" fill="#fff" stroke="#1f2a2e" stroke-width="2.5"/><path d="M24 6v14H14v-4a10 10 0 0 1 10-10z" fill="#2e8b57" stroke="#1f2a2e" stroke-width="2.5"/><path d="M14 20h20" stroke="#1f2a2e" stroke-width="2.5"/></svg><b>按住滑鼠左鍵</b><span>輪椅往前走</span></div>
        <div><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="6" width="20" height="36" rx="10" fill="#fff" stroke="#1f2a2e" stroke-width="2.5"/><path d="M24 6v14M14 20h20" stroke="#1f2a2e" stroke-width="2.5"/><rect x="19" y="26" width="10" height="10" rx="2" fill="#d9822b"/></svg><b>放開左鍵</b><span>輪椅停下來</span></div>
        <div><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="17" y="10" width="14" height="28" rx="7" fill="#fff" stroke="#1f2a2e" stroke-width="2.5"/><path d="M12 24H3m0 0l5-5m-5 5l5 5M36 24h9m0 0l-5-5m5 5l-5 5" fill="none" stroke="#2b6f8f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>滑鼠左右移動</b><span>像搖桿:離中間越遠,轉得越快</span></div>
      </div>
      <div class="levels">
        <button type="button" data-level="1"><b>第一關</b><span>沿著路徑前進</span></button>
        <button type="button" data-level="2"><b>第二關</b><span>路上有行人,閃過再回到路徑</span></button>
        <button type="button" data-level="3"><b>第三關</b><span>連續兩位行人,左右閃避</span></button>
      </div>
      <div class="opts">
        <div class="opt"><span>路徑寬度</span>
          <div class="seg" role="radiogroup" aria-label="路徑寬度">
            <label><input type="radio" name="pw" value="1.3" checked>窄</label>
            <label><input type="radio" name="pw" value="1.6">中</label>
            <label><input type="radio" name="pw" value="2.0">寬</label>
          </div></div>
        <div class="opt"><span>轉向靈敏度</span>
          <div class="seg" role="radiogroup" aria-label="轉向靈敏度">
            <label><input type="radio" name="sens" value="0.45">低</label>
            <label><input type="radio" name="sens" value="0.7" checked>中</label>
            <label><input type="radio" name="sens" value="1.0">高</label>
          </div></div>
      </div>
      <p id="loadMsg">影片載入中…</p>
      <p class="note">「窄」是比輪椅稍寬一點的路徑。平板也可以玩:手指按住畫面前進,左右滑動轉向。</p>
    </div>
  </div>

  <div id="result" class="panel hidden">
    <div class="card">
      <h2 id="resTitle"></h2>
      <p id="resMsg"></p>
      <table class="res" id="resTable"></table>
      <div class="row">
        <button type="button" class="main" id="resNext"></button>
        <button type="button" id="resAgain">再玩一次</button>
        <button type="button" id="resMenu">回選單</button>
      </div>
      <p class="note">這些數字是這一次練習的紀錄,適合在同一台裝置、同一關之間比較,不代表評估或診斷結果。</p>
    </div>
  </div>
</div>

  for(let i=ss.length-1;i>=0;i--){ const p=proj(ss[i],pathC(ss[i])+o1); c.lineTo(p[0],p[1]); }
  c.closePath();
}
function drawFloor(c){
  const hw=st.halfW, s0=Math.max(sNear(),-2), s1=Math.min(st.S+48,LEVEL_LEN+2.5);
  if(s1<=s0) return;
  const ss=samples(s0,s1);
  c.save(); wedge(c); c.clip();
  // lane: tint the real floor so reflections stay visible
  c.globalCompositeOperation='multiply';
  c.fillStyle = st.on ? 'rgb(150,226,168)' : 'rgb(246,214,150)';
  band(c,ss,-hw,hw); c.fill();
  // direction chevrons every 2 m
  c.fillStyle = st.on ? 'rgb(96,186,122)' : 'rgb(226,170,96)';
  const k0=Math.ceil(s0/2), k1=Math.floor(Math.min(s1,st.S+30)/2), cw=Math.min(0.26,hw*0.62);
  for(let k=k0;k<=k1;k++){
    const s=k*2; if(s<1||s>LEVEL_LEN-1) continue;
    const pts=[[s+0.62,0],[s+0.12,cw],[s-0.12,cw],[s+0.38,0],[s-0.12,-cw],[s+0.12,-cw]];
    c.beginPath();
    pts.forEach((q,i)=>{ const p=proj(q[0],pathC(s)+q[1]); i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); });
    c.closePath(); c.fill();
  }
  // edge lines
  c.globalCompositeOperation='source-over';
  const ew=0.05;
  c.fillStyle = (!st.on && st.offSide<0) ? '#e0761a' : '#1f7a4a';
  band(c,ss,-hw-ew,-hw); c.fill();
  c.fillStyle = (!st.on && st.offSide>0) ? '#e0761a' : '#1f7a4a';
  band(c,ss,hw,hw+ew); c.fill();
  // finish line (checkered)
  const fs=LEVEL_LEN;
  if(fs>s0 && fs<s1){
    const cols=8, w=(hw*2+0.5), cell=w/cols;
    for(let r=0;r<2;r++) for(let q=0;q<cols;q++){
      const a0=fs+r*cell, a1=a0+cell, x0=pathC(fs)-w/2+q*cell, x1=x0+cell;
      const p=[proj(a0,x0),proj(a0,x1),proj(a1,x1),proj(a1,x0)];
      c.fillStyle=((r+q)%2)?'#1f2a2e':'#ffffff';
      c.beginPath(); p.forEach((u,i)=>i?c.lineTo(u[0],u[1]):c.moveTo(u[0],u[1])); c.closePath(); c.fill();
    }
  }
  c.restore();
}
function drawGhost(c){                   // faint dashed outline so the path can be read through the wheelchair
  const hw=st.halfW, s0=st.S+0.2, s1=Math.min(st.S+40,LEVEL_LEN);
  if(s1<=s0) return;
  const ss=samples(s0,s1);
  c.save(); wedge(c); c.clip();
  c.setLineDash([9,9]); c.lineJoin='round';
  for(const side of [-1,1]){
    c.beginPath();
    ss.forEach((s,i)=>{ const p=proj(s,pathC(s)+side*hw); i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]); });
    c.strokeStyle='rgba(20,60,36,.28)'; c.lineWidth=3.6; c.stroke();
    c.strokeStyle=(!st.on && st.offSide===side)?'rgba(255,214,170,.9)':'rgba(255,255,255,.7)'; c.lineWidth=1.6; c.stroke();
  }
  c.restore();
}

/* ---------------- drawing: pedestrians ---------------- */
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawPed(c,p,now,shadow){
  const q=proj(p.s,p.x+p.dx), m=q[2]*p.h, x=q[0], y=q[1];
  if(q[1]<P.vy || m<8) return;
  const sway=Math.sin(now/520+p.ph)*0.012*m;
  c.save(); c.globalAlpha=p.alpha;
  if(shadow){ c.fillStyle='rgba(30,40,50,.28)'; c.beginPath(); c.ellipse(x,y,0.30*m,0.075*m,0,0,7); c.fill(); }
  c.translate(x+sway,y); c.lineJoin='round';
  const S=p.style, ol='rgba(25,30,35,.55)'; c.lineWidth=Math.max(1,0.012*m); c.strokeStyle=ol;
  // legs
  c.fillStyle=S.pants;
  rr(c,-0.17*m,-0.86*m,0.15*m,0.84*m,0.05*m); c.fill(); c.stroke();
  rr(c, 0.02*m,-0.86*m,0.15*m,0.84*m,0.05*m); c.fill(); c.stroke();
  // shoes
  c.fillStyle='#2a2a2a';
  rr(c,-0.19*m,-0.07*m,0.18*m,0.07*m,0.03*m); c.fill();
  rr(c, 0.01*m,-0.07*m,0.18*m,0.07*m,0.03*m); c.fill();
  // arms
  c.fillStyle=S.shirt;
  rr(c,-0.31*m,-1.40*m,0.10*m,0.58*m,0.05*m); c.fill(); c.stroke();
  rr(c, 0.21*m,-1.40*m,0.10*m,0.58*m,0.05*m); c.fill(); c.stroke();
  // hands
  c.fillStyle=S.skin;
  c.beginPath(); c.arc(-0.26*m,-0.80*m,0.045*m,0,7); c.fill();
  c.beginPath(); c.arc( 0.26*m,-0.80*m,0.045*m,0,7); c.fill();
  // torso
  c.fillStyle=S.shirt; rr(c,-0.22*m,-1.44*m,0.44*m,0.64*m,0.09*m); c.fill(); c.stroke();
  // neck + head
  c.fillStyle=S.skin; rr(c,-0.05*m,-1.50*m,0.10*m,0.09*m,0.02*m); c.fill();
  c.beginPath(); c.arc(0,-1.60*m,0.115*m,0,7); c.fill(); c.stroke();
  // hair
  c.fillStyle=S.hair; c.beginPath(); c.arc(0,-1.625*m,0.12*m,Math.PI*1.02,Math.PI*1.98); c.closePath(); c.fill();
  // face (only when large enough to read)
  if(m>55){
    c.fillStyle='#2b2b2b';
    c.beginPath(); c.arc(-0.042*m,-1.60*m,0.012*m,0,7); c.arc(0.042*m,-1.60*m,0.012*m,0,7); c.fill();
    c.beginPath(); c.arc(0,-1.575*m,0.04*m,0.15*Math.PI,0.85*Math.PI); c.lineWidth=Math.max(1,0.01*m); c.strokeStyle='#2b2b2b'; c.stroke();
  }
  c.restore();
}
function drawMarker(c,p,now){            // floating marker so an oncoming person is noticed even when hidden
  const d=p.s-st.S; if(d<1.2||d>26||p.hit||p.passed) return;
  const q=proj(p.s,p.x+p.dx), m=q[2]*p.h;
  const y=Math.max(26, q[1]-1.95*m + Math.sin(now/300)*3), x=q[0], r=Math.max(9,Math.min(16,0.16*m));
  c.save();
  c.fillStyle='#e0761a'; c.strokeStyle='#fff'; c.lineWidth=2.5; c.lineJoin='round';
  c.beginPath(); c.moveTo(x-r,y-r*1.5); c.lineTo(x+r,y-r*1.5); c.lineTo(x,y); c.closePath(); c.fill(); c.stroke();
  c.restore();
}

/* ---------------- drawing: joystick ---------------- */
function drawStick(c){
  const cx=640, y=668, half=150;
  c.save();
  c.fillStyle='rgba(251,250,246,.88)'; rr(c,cx-half-18,y-17,half*2+36,34,17); c.fill();
  c.fillStyle='#dfe4dc'; rr(c,cx-half,y-5,half*2,10,5); c.fill();
  c.fillStyle='#9aa69e'; c.fillRect(cx-1.5,y-12,3,24);
  const moving=isMoving();
  c.fillStyle= moving ? '#2e8b57' : '#8a959a';
  const kx=cx+st.js*half;
  if(Math.abs(st.js)>0.02){ c.globalAlpha=.45; c.fillRect(Math.min(cx,kx),y-5,Math.abs(kx-cx),10); c.globalAlpha=1; }
  c.beginPath(); c.arc(kx,y,13,0,7); c.fill(); c.strokeStyle='#fff'; c.lineWidth=3; c.stroke();
  c.fillStyle='#4a5a60'; c.font='600 15px '+getComputedStyle(document.body).fontFamily; c.textBaseline='middle';
  c.textAlign='right'; c.fillText('左',cx-half-26,y); c.textAlign='left'; c.fillText('右',cx+half+26,y);
  c.restore();
}

/* ---------------- render ---------------- */
function render(now){
  if(!st.ready) return;
  setFrame(st.frame);
  fctx.drawImage(vid,0,0,1280,1080);
  const playing = st.mode==='play'||st.mode==='result';
  if(!playing){                         // menu: plain frame
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    ctx.drawImage(fc,0,0,1280,720,0,0,1280,720);
    return;
  }
  // 1) scene = video + things painted on / standing on the floor ahead
  c1.globalCompositeOperation='source-over'; c1.globalAlpha=1;
  c1.drawImage(fc,0,0,1280,720,0,0,1280,720);
  drawFloor(c1);
  const far=st.peds.filter(p=>p.s>=st.S-0.25 && p.alpha>0).sort((a,b)=>b.s-a.s);
  far.forEach(p=>drawPed(c1,p,now,true));
  // 2) keep the real wheelchair and people in front: scene*(1-M) + video*M
  c1.globalCompositeOperation='multiply';
  c1.drawImage(fc,641,721,638,358,0,0,1280,720);
  actx.globalCompositeOperation='source-over';
  actx.drawImage(fc,0,0,1280,720,0,0,1280,720);
  actx.globalCompositeOperation='multiply';
  actx.drawImage(fc,1,721,638,358,0,0,1280,720);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  ctx.drawImage(ac,0,0);
  ctx.globalCompositeOperation='lighter';
  ctx.drawImage(c1c,0,0);
  ctx.globalCompositeOperation='source-over';
  // 3) overlays
  drawGhost(ctx);
  st.peds.filter(p=>p.s<st.S-0.25 && p.s>sNear()+0.1 && p.alpha>0).sort((a,b)=>b.s-a.s).forEach(p=>{
    const keep=p.alpha; p.alpha=keep*Math.max(0,1-(st.S-0.25-p.s)/0.8);   // fade out once it is behind the wheelchair
    if(p.alpha>0.02) drawPed(ctx,p,now,true); p.alpha=keep; });
  st.peds.forEach(p=>drawMarker(ctx,p,now));
  if(st.fade>0){ ctx.fillStyle='rgba(244,244,240,'+st.fade.toFixed(3)+')'; ctx.fillRect(0,0,1280,720); }
  drawStick(ctx);
}

/* ---------------- game logic ---------------- */
function isMoving(){ return st.mode==='play' && (st.holding||st.keyFwd) && performance.now()>=st.blockedUntil; }
function newStat(){ return {dist:0,distOn:0,sumAbs:0,cross:0,hits:0,dodged:0,stops:0}; }
function startLevel(lv){
  st.level=lv; st.mode='play'; st.frame=0; st.loop=0; st.S=0; st.x=0; st.js=0; st.j=0;
  st.holding=false; st.keyFwd=false; st.blockedUntil=0; st.started=false; st.tMove=0;
  st.on=true; st.offSide=0; st.lastCrossS=-9; st.stat=newStat(); st.lastVF=-1; st.fade=0;
  st.halfW = CHAIR_W*parseFloat(document.querySelector('input[name=pw]:checked').value)/2;
  st.sens  = parseFloat(document.querySelector('input[name=sens]:checked').value);
  st.peds = LEVELS[lv].peds.map((q,i)=>({s:q[0],x:pathC(q[0])+q[1],dx:0,side:0,alpha:1,hit:false,passed:false,warned:false,h:[0.95,0.9,0.97,0.92,0.96,0.91][i%6],
                                         style:PED_STYLES[(i+lv*2)%PED_STYLES.length],ph:i*1.7}));
  vid.pause(); try{ vid.currentTime=0; }catch(e){}
  $('menu').classList.add('hidden'); $('result').classList.add('hidden'); $('hud').classList.remove('hidden');
  $('lvName').textContent=LEVELS[lv].name;
  setHint('按住滑鼠左鍵,輪椅就會往前走',1e9);
  updateHud();
}
function setHint(t,ms,warn){ st.hintTxt=t; st.hintUntil=performance.now()+ms; st.hintWarn=!!warn;
  const h=$('hint'); h.textContent=t; h.classList.toggle('warn',!!warn); h.classList.add('show'); }
function advance(f){                    // called for every new video frame while driving
  const prevS=st.S;
  if(f < st.frame - N/2) st.loop++;      // the video wrapped around
  st.frame=f;
  const S=st.loop*LOOP_LEN + D.sc[f];
  if(S<=prevS) return;
  const ds=Math.min(S-prevS,0.6);
  st.S=S;
  // steering: sideways travel is proportional to forward travel (like turning while driving)
  st.x += st.js*st.sens*ds;
  const cHere=pathC(st.S+0.35);
  let e=st.x-cHere;
  if(e>1.6){ e=1.6; st.x=cHere+e; } else if(e<-1.05){ e=-1.05; st.x=cHere+e; }
  // path keeping (sections around a pedestrian are not counted)
  const nearPed = st.peds.some(p=>st.S>p.s-4.5 && st.S<p.s+3);
  const tol=Math.max(0.02,st.halfW-CHAIR_HALF)+0.03;
  const wasOn=st.on;
  st.on = Math.abs(e) <= (wasOn?tol:tol-0.03);
  st.offSide = st.on?0:(e>0?1:-1);
  if(!nearPed && st.S>2 && st.S<LEVEL_LEN){
    st.stat.dist+=ds; st.stat.sumAbs+=Math.abs(e)*ds; if(st.on) st.stat.distOn+=ds;
    if(wasOn && !st.on && st.S-st.lastCrossS>0.8){ st.stat.cross++; st.lastCrossS=st.S; }
  }
  // pedestrians
  for(const p of st.peds){
    if(p.hit||p.passed) continue;
    const d=p.s-st.S, lat=Math.abs(p.x-st.x);
    if(d<CHAIR_FRONT && d>-0.2 && lat<CHAIR_HALF+PED_HALF){
      p.hit=true; p.side = (p.x-st.x)>=0?1:-1; st.stat.hits++;
      st.blockedUntil=performance.now()+1300; vid.pause(); thud();
      setHint('碰到行人了,等他讓開再繼續',2200,true);
    } else if(d<-0.2){ p.passed=true; st.stat.dodged++; chirp(); setHint('閃過了!回到路徑上',1600); }
  }
  if(st.S>=LEVEL_LEN) finish();
}
function tick(now){                      // every animation frame
  const dt=Math.min(0.05,(now-st.lastT)/1000||0); st.lastT=now;
  if(st.mode==='play'){
    let j=st.pointerJ;
    if(st.keyL||st.keyR) j=(st.keyR?1:0)-(st.keyL?1:0);
    st.j=j; st.js += (j-st.js)*(1-Math.exp(-dt/0.16));
    const mv=isMoving();
    if(mv){
      if(!st.started){ st.started=true; st.tStart=now; setHint('沿著綠色路徑前進',2500); }
      st.tMove+=dt;
      const r=D.rate[st.frame]; if(Math.abs(vid.playbackRate-r)>0.04) vid.playbackRate=r;
      if(vid.paused){ const pr=vid.play(); if(pr&&pr.catch) pr.catch(()=>{}); }
    } else if(!vid.paused) vid.pause();
    hum(mv);
    // pedestrians that were bumped step aside and fade
    for(const p of st.peds) if(p.hit && p.alpha>0){ p.dx += p.side*1.1*dt; if(Math.abs(p.dx)>0.5) p.alpha=Math.max(0,p.alpha-dt*1.8); }
    // soft dip to white where the video loops
    const f=st.frame; st.fade = Math.min(0.88, Math.max(0, st.loop>0 ? 1-f/7 : 0, (f-(N-8))/7));
    // hints
    if(st.started){
      const e=st.x-pathC(st.S+0.35);
      const ahead=st.peds.find(p=>!p.hit&&!p.passed&&!p.warned&&p.s-st.S<8&&p.s-st.S>0);
      if(ahead){ ahead.warned=true; setHint('前面有行人,從旁邊繞過去',2400,false); }
      if(now>st.hintUntil){
        const dodging=st.peds.some(p=>st.S>p.s-4.5 && st.S<p.s+1.5);
        if(Math.abs(e)>st.halfW && !dodging) setHint(e>0?'← 路徑在左邊':'路徑在右邊 →',700,true);
        else $('hint').classList.remove('show');
      }
    }
    updateHud();
    if(!HAS_RVFC){ const f2=Math.min(N-1,Math.max(0,Math.round(vid.currentTime*FPS))); if(f2!==st.lastVF){ st.lastVF=f2; if(mv||f2!==st.frame) advance(f2); } }
  } else hum(false);
  if(!HAS_RVFC || vid.paused || st.mode!=='play') render(now);
  requestAnimationFrame(tick);
}
const HAS_RVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
function onVF(now,meta){
  const f=Math.min(N-1,Math.max(0,Math.round(meta.mediaTime*FPS)));
  if(st.mode==='play'){ if(f!==st.lastVF){ st.lastVF=f; advance(f); } }
  else st.frame=f;
  render(performance.now());
  vid.requestVideoFrameCallback(onVF);
}
function updateHud(){
  const pct=Math.max(0,Math.min(100,Math.round(st.S/LEVEL_LEN*100)));
  $('progFill').style.width=pct+'%'; $('progTxt').textContent=pct+'%';
  const out=Math.abs(st.x-pathC(st.S+0.35))>st.halfW;
  $('status').classList.toggle('off',!st.on); $('statusTxt').textContent=st.on?'在路徑上':(out?'離開路徑了':'壓到邊線了');
}
function finish(){
  st.mode='result'; vid.pause(); hum(false); chime();
  const s=st.stat, t=(performance.now()-st.tStart)/1000, lv=st.level;
  const pctOn = s.dist>0 ? Math.round(s.distOn/s.dist*100) : 100;
  const dev = s.dist>0 ? (s.sumAbs/s.dist*100) : 0;
  const total=st.peds.length;
  $('resTitle').textContent=LEVELS[lv].name+' 完成!';
  let msg='你把輪椅開到終點了。';
  if(total && s.hits===0) msg='你把輪椅開到終點,而且每位行人都順利閃過了。';
  else if(total && s.hits>0) msg='你把輪椅開到終點了。下一次看到行人,試試先慢下來,再從旁邊繞過去。';
  else if(pctOn>=85) msg='你把輪椅開到終點,路徑也走得很穩。';
  $('resMsg').textContent=msg;
  const rows=[
    ['完成時間', fmtT(t)+' <small>(前進 '+fmtT(st.tMove)+')</small>'],
    ['保持在路徑內', pctOn+'% <small>的路程</small>'],
    ['壓到邊線', s.cross+' <small>次</small>'],
    ['平均偏離路徑中央', dev.toFixed(0)+' <small>公分</small>'],
  ];
  if(total){ rows.push(['順利閃過行人', (total-s.hits)+' / '+total+' <small>位</small>']); rows.push(['碰到行人', s.hits+' <small>次</small>']); }
  $('resTable').innerHTML=rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('');
  if(total) $('resTable').insertAdjacentHTML('beforeend','<tr><td colspan="2"><small>繞過行人的那幾段路不列入「路徑內」與「壓線」的計算。</small></td></tr>');
  $('resNext').textContent = lv<3 ? '下一關' : '從第一關再來';
  $('resNext').onclick=()=>startLevel(lv<3?lv+1:1);
  $('hud').classList.add('hidden'); $('result').classList.remove('hidden');
  $('resNext').focus();
}
function fmtT(t){ const m=Math.floor(t/60), s=Math.round(t-m*60); return (m?m+' 分 ':'')+s+' 秒'; }
function toMenu(){ st.mode='menu'; vid.pause(); hum(false); st.holding=false;
  $('hud').classList.add('hidden'); $('result').classList.add('hidden'); $('menu').classList.remove('hidden'); }

/* ---------------- sound (soft, optional) ---------------- */
let AC=null, humG=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), o2=AC.createOscillator(), lp=AC.createBiquadFilter(); humG=AC.createGain();
    o.type='sawtooth'; o.frequency.value=62; o2.type='sine'; o2.frequency.value=124; lp.type='lowpass'; lp.frequency.value=260;
    humG.gain.value=0; o.connect(lp); o2.connect(lp); lp.connect(humG); humG.connect(AC.destination); o.start(); o2.start(); }catch(e){ AC=null; } }
  if(AC && AC.state==='suspended') AC.resume(); return AC; }
function hum(on){ if(!AC||!humG) return; const g=(on&&st.sound)?0.035:0; humG.gain.setTargetAtTime(g,AC.currentTime,0.08); }
function tone(f0,f1,dur,vol,type,delay){ if(!st.sound||!audio()) return; const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.05); }
const thud =()=>tone(150,70,0.28,0.16,'sine');
const chirp=()=>tone(520,780,0.18,0.07,'sine');
const chime=()=>{ tone(523,523,0.35,0.09,'sine'); tone(659,659,0.35,0.09,'sine',0.16); tone(784,784,0.55,0.09,'sine',0.32); };

/* ---------------- input ---------------- */
const stage=$('stage');
function jFromX(clientX){ const r=stage.getBoundingClientRect(); let v=((clientX-r.left)/r.width-0.5)/0.30;
  const dz=0.07; v = Math.abs(v)<dz ? 0 : (v-Math.sign(v)*dz)/(1-dz); return Math.max(-1,Math.min(1,v)); }
document.addEventListener('contextmenu',e=>{ if(st.mode==='play' || e.target.closest('#stage')) e.preventDefault(); });
window.addEventListener('pointermove',e=>{ st.pointerJ=jFromX(e.clientX); });
// mouse: hold the LEFT button to drive
stage.addEventListener('mousedown',e=>{
  if(st.mode!=='play' || e.target.closest('button')) return;
  st.pointerJ=jFromX(e.clientX);
  if(e.button===0){ e.preventDefault(); audio(); st.holding=true; }
  else if(e.button===2 && !st.started) setHint('要按住滑鼠「左鍵」,輪椅才會前進',2500,true);
});
window.addEventListener('mouseup',e=>{ if(e.button===0) st.holding=false; });
// touch / pen: press and hold anywhere to drive
stage.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse' || st.mode!=='play' || e.target.closest('button')) return;
  e.preventDefault(); st.pointerJ=jFromX(e.clientX); audio(); st.holding=true;
});
const touchEnd=e=>{ if(e.pointerType!=='mouse') st.holding=false; };
window.addEventListener('pointerup',touchEnd); window.addEventListener('pointercancel',touchEnd);
window.addEventListener('blur',()=>{ st.holding=false; st.keyFwd=st.keyL=st.keyR=false; });
window.addEventListener('keydown',e=>{
  if(st.mode!=='play') return;
  if(e.key==='ArrowUp'||e.key===' '){ st.keyFwd=true; audio(); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ st.keyL=true; e.preventDefault(); }
  else if(e.key==='ArrowRight'){ st.keyR=true; e.preventDefault(); }
  else if(e.key==='Escape') toMenu();
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'||e.key===' ') st.keyFwd=false;
  else if(e.key==='ArrowLeft') st.keyL=false;
  else if(e.key==='ArrowRight') st.keyR=false;
});
document.querySelectorAll('.levels button').forEach(b=>b.addEventListener('click',()=>{ if(st.ready){ audio(); startLevel(+b.dataset.level); } }));
$('btnMenu').addEventListener('click',toMenu);
$('resMenu').addEventListener('click',toMenu);
$('resAgain').addEventListener('click',()=>startLevel(st.level));
$('btnSound').addEventListener('click',()=>{ st.sound=!st.sound; $('btnSound').textContent='聲音:'+(st.sound?'開':'關'); $('btnSound').setAttribute('aria-pressed',st.sound); });

/* ---------------- boot ---------------- */
vid.addEventListener('loadeddata',()=>{ st.ready=true; $('loadMsg').textContent='選一關開始練習'; });
vid.addEventListener('error',()=>{ const m=$('loadMsg'); m.classList.add('err');
  m.textContent='找不到影片檔「'+VIDEO_FILE+'」。請把它和這個網頁放在同一個資料夾。'; });
vid.src=VIDEO_FILE; vid.load();
if(HAS_RVFC) vid.requestVideoFrameCallback(onVF);
requestAnimationFrame(tick);
window.__game={st,LEVELS,LEVEL_LEN,LOOP_LEN,pathC,startLevel};   // for checking
})();
</script>
</body>
</html>
